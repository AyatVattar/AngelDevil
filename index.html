<!DOCTYPE html>
<html x-data="darkMode" lang="en" :class="{ 'dark' : darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="main.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  
</head>
<body class="body-dark">
 
    <div class="d-flex align-items-center justify-content-start py-4">

<i class="fa-solid fa-sun fa-1x me-2 lh-0 dark-text-white light-text-dark"></i>

        <div class="form-check form-switch">
  <input x-model="darkMode" class="form-check-input dark-switch" type="checkbox" role="switch" id="switchCheckDefault">
</div>

<i class="fa-solid fa-moon fa-1x ms-2 lh-0 dark-text-white light-text-dark"></i>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.3/dist/cdn.min.js"></script>

     <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('darkMode', () => ({
            darkMode: false,

            init(){
                this.darkMode = localStorage.theme ==='dark' ? true : false

                this.$watch('darkMode', (value) => {
                    localStorage.theme = value ? 'dark' : 'light';
                } )
            }

          
        }))
    })
</script>
</body>
</html>
